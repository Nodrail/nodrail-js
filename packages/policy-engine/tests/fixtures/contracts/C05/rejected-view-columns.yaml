description: A view shows reported fields only, and single values only.
nodrail.yaml:
  shapes:
    reviewer-result:
      properties:
        verdict:
          {
            values: [ship, ship-with-debt, fix-first, unassessable],
            role: verdict,
          }
        issue: { type: string, max: 100 }
        findings:
          role: findings
          report: true
          properties:
            blocker: { type: integer, min: 0 }
            major: { type: integer, min: 0 }
        lesson: { type: string, max: 300, optional: true }
    qa-result:
      properties:
        verdict: { values: [pass, fail], role: verdict }
        checks: { type: integer, min: 0, report: true }
        flaky: { type: integer, min: 0, optional: true, report: true }
    ci-result:
      properties:
        status: { values: [passed, failed], report: true }
        tests: { type: integer, min: 0, report: true }
        duration_ms: { type: integer, min: 0, unit: ms, report: true }
        log_url: { type: string, max: 500 }
  receipts:
    reviewer: { shape: reviewer-result }
    qa: { shape: qa-result }
  evidence:
    ci-tests:
      shape: ci-result
      producers:
        - { class: externally-verified, verifier: github-actions }
      subject: revision
  views:
    reviews:
      source: { receipt: reviewer }
      columns: [verdict, issue, findings]
      filters: [lesson]
    missing:
      source: { receipt: designer }
      columns: [verdict]
expect:
  - { code: not-reported, path: nodrail.yaml.views.reviews.columns.1 }
  - { code: path-type, path: nodrail.yaml.views.reviews.columns.2 }
  - { code: not-reported, path: nodrail.yaml.views.reviews.filters.0 }
  - { code: unknown-reference, path: nodrail.yaml.views.missing.source }

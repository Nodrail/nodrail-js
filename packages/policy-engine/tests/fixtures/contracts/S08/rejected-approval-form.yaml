description: >-
  A form is attached to require_approval entries only, and its shapes carry
  no receipt roles.
nodrail.yaml:
  shapes:
    refund-request:
      properties:
        purpose: { type: string, report: true }
        verdict: { values: [ok, not-ok], role: verdict }
  approvals:
    refund:
      request: refund-request
      routes: [{ approvers: { role: approver } }]
policy:
  - required_engine_version: 4
  - rule: Refunds
    tool: stripe
    operation: refund
    resource: { kind: charge, match: any }
    effect: allow
    approval: refund
expect:
  - { code: role-unsupported, path: nodrail.yaml.approvals.refund.request }
  - { code: approval-effect, path: policy.1.approval }

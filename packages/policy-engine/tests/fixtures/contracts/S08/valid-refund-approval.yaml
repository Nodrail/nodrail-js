description: >-
  An approval request form with purpose, risk and rollback, and a decision
  form. The rule binds it to the exact refund action; a changed action or
  form schema invalidates an earlier approval.
nodrail.yaml:
  shapes:
    refund-request:
      properties:
        purpose:
          { type: string, max: 300, report: true, for: "Why this refund" }
        risk: { values: [low, medium, high], report: true }
        rollback: { type: string, max: 300, report: true }
        amount: { type: integer, min: 1, unit: usd_cents, report: true }
        customer_email: { type: string, max: 254, classification: pii }
    refund-decision:
      properties:
        ticket: { type: string, max: 40, optional: true, report: true }
  approvals:
    refund:
      request: refund-request
      decision: refund-decision
      routes:
        - { where: { amount: { min: 10000 } }, approvers: { role: admin } }
        - { approvers: { role: approver } }
policy:
  - required_engine_version: 4
  - rule: Refunds need a person
    tool: stripe
    operation: refund
    resource: { kind: charge, match: any }
    effect: require_approval
    approval: refund
cases:
  - name: a complete request
    target: request:refund
    value:
      {
        purpose: "Duplicate charge",
        risk: low,
        rollback: "Recharge",
        amount: 4200,
        customer_email: a@b.c,
      }
    expect: valid
    projection:
      {
        purpose: "Duplicate charge",
        risk: low,
        rollback: "Recharge",
        amount: 4200,
      }
  - name: a request without a rollback plan
    target: request:refund
    value: { purpose: "x", risk: high, amount: 4200, customer_email: a@b.c }
    expect: invalid
    issues: ["rollback: required"]

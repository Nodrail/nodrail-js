description: A verdict belongs to receipts only; a brief that declares one is refused.
nodrail.yaml:
  shapes:
    review-brief:
      properties:
        issue: { type: string, max: 100 }
        verdict: { values: [ship, fix-first], role: verdict }
resources:
  - apiVersion: apf.nodrail.com/v1alpha1
    kind: Agent
    metadata: { name: reviewer }
    spec: { brief: review-brief }
expect:
  - { code: role-unsupported, path: resources.0.spec.brief }

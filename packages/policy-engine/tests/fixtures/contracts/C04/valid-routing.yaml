description: >-
  Routes pick eligible approvers from reported request fields and server
  roles; the first matching route wins, the last can catch the rest, and an
  empty eligible group stays blocked. Routing never creates permission.
nodrail.yaml:
  shapes:
    refund-request:
      properties:
        purpose: { type: string, max: 300, report: true }
        risk: { values: [low, medium, high], report: true }
        amount: { type: integer, min: 1, unit: usd_cents, report: true }
        customer_email: { type: string, max: 254, classification: pii }
  approvals:
    refund:
      request: refund-request
      routes:
        - { where: { risk: high }, approvers: { role: admin } }
        - {
            where: { amount: { min: 10000 }, risk: { in: [low, medium] } },
            approvers: { group: finance },
          }
        - { approvers: { role: approver } }

description: >-
  Cloud routes on what it receives, so a route can't read a pii field; and a
  catch-all route that isn't last hides the routes after it.
nodrail.yaml:
  shapes:
    refund-request:
      properties:
        purpose: { type: string, max: 300, report: true }
        risk: { values: [low, medium, high], report: true }
        amount: { type: integer, min: 1, unit: usd_cents, report: true }
        customer_email: { type: string, max: 254, classification: pii }
  approvals:
    refund:
      request: refund-request
      routes:
        - { approvers: { role: approver } }
        - {
            where: { customer_email: "vip@example.com" },
            approvers: { role: admin },
          }
expect:
  - { code: route-order, path: nodrail.yaml.approvals.refund.routes.0 }
  - {
      code: not-reported,
      path: nodrail.yaml.approvals.refund.routes.1.where.customer_email,
    }

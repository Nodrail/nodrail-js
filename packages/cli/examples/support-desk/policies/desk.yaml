# Who may search which part of the handbook, and who may publish.
- rule: Public handbook for everyone
  tool: handbook
  operation: search
  resource: { kind: collection, match: exact, value: public }
  effect: allow
- rule: Internal handbook for support
  agent: support
  tool: handbook
  operation: search
  resource: { kind: collection, match: exact, value: internal }
  effect: allow
- rule: Marketing never publishes
  agent: marketing
  tool: outbox
  operation: publish
  resource: { kind: channel, match: any }
  effect: deny
# Support publishes to the help center only; any other channel, the blog
# included, has no rule that allows it, so it is denied.
- rule: Support publishes to the help center
  agent: support
  tool: outbox
  operation: publish
  resource: { kind: channel, match: exact, value: help-center }
  effect: allow

kind: nodrail.module/v1
name: "@nodrail/dependency-updates"
version: 1.0.0
description: >-
  A deps agent may change JavaScript lockfiles inside the project and refresh
  them without running scripts, commit, and push its own branch. It may never
  change package.json, push to main or master, merge or force-push. It may
  open a draft pull request in your repository once the checks pass on its
  latest change.
parameters:
  repository:
    type: repository
    description: The repository the draft pull request is opened in, as owner/name.
imports:
  - policies/files.yaml
  - policies/commands.yaml
  - policies/pull-request.yaml
roles:
  deps: Updates lockfiles, proposes package.json changes; opens a draft pull request.
  gatekeeper: Runs the checks on the deps agent's latest change.

# Lockfile refreshes, exactly as written: no install scripts run, and pnpm
# skips its config hook. Anything else, a full install included, isn't here.
- list: lockfile_commands
  items:
    - pnpm install --lockfile-only --ignore-scripts --ignore-pnpmfile
    - npm install --package-lock-only --ignore-scripts

- rule: Refresh lockfiles
  id: deps-lockfile-commands
  agent: deps
  command: { list: lockfile_commands }
  effect: allow

# A commit runs the repository's git hooks, which package.json can set up;
# the deps agent can't change package.json (files.yaml), so it may commit.
- rule: Commit
  id: deps-commit
  agent: deps
  command: { prefix: git commit }
  effect: allow

# A push that names its branch leaves the machine for review in a pull
# request. A bare push could push whatever is checked out, so it is denied.
- rule: Push a named branch
  id: deps-push
  agent: deps
  command: { prefix: git push origin }
  effect: allow

- list: unnamed_push_commands
  items:
    - git push
    - git push origin
    - git push origin HEAD

- rule: Never push without naming a branch
  id: deps-no-unnamed-push
  agent: deps
  command: { list: unnamed_push_commands }
  effect: deny

# Merging to main is for people, never the agent.
- list: main_push_commands
  items:
    - git push origin main
    - git push origin master
    - git push origin HEAD:main
    - git push origin HEAD:master

- rule: Never push to main
  id: deps-no-main-push
  agent: deps
  command: { list: main_push_commands, match: prefix }
  effect: deny

- list: force_push_commands
  items:
    - git push --force
    - git push --force-with-lease
    - git push --force-if-includes
    - git push -f
    - git push --mirror
    - git push --delete

- rule: Never force-push
  id: deps-no-force-push
  agent: deps
  command: { list: force_push_commands, match: prefix }
  effect: deny

# What triage never does, in any repository, whatever else a project allows.

- rule: Triage never runs issues.close
  id: triage-no-issues-close
  agent: triage
  tool: github
  operation: issues.close
  resource: { kind: repository, match: any }
  effect: deny

- rule: Triage never runs issues.update
  id: triage-no-issues-update
  agent: triage
  tool: github
  operation: issues.update
  resource: { kind: repository, match: any }
  effect: deny


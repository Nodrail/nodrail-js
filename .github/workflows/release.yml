name: Release

# Changesets opens a "Version packages" pull request. Merging it publishes to
# npm with provenance, tags each package and creates its GitHub release.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release

jobs:
  release:
    name: Version and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The npm token lives only in this environment, which only main can use.
    environment: npm
    permissions:
      contents: write # push version commits and tags, write releases
      pull-requests: write # open the "Version packages" pull request
      id-token: write # npm provenance
    steps:
      # Credentials stay: changesets pushes the version branch and tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          commit-message: Version packages
          pr-title: Version packages
          # Publishing stays off until the repository variable is set.
          publish-script: ${{ vars.NPM_PUBLISH_ENABLED == 'true' && 'pnpm release' || '' }}
          create-github-releases: true
          push-git-tags: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

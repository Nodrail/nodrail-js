name: Release

# Changesets opens a "Version packages" pull request. Merging it stages each
# new version on npm with provenance, tags it and writes its GitHub release.
# Nothing is installable until a maintainer approves it with two-factor
# authentication (npm stage approve).
#
# npm trusted publishing checks this workflow's identity directly, so no npm
# token is stored anywhere. Each package on npmjs.com trusts Nodrail/nodrail-js,
# release.yml, environment "npm".
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release

jobs:
  release:
    name: Version and stage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # npm trusts only this environment, which only main can use.
    environment: npm
    permissions:
      contents: write # push version commits and tags, write releases
      pull-requests: write # open the "Version packages" pull request
      id-token: write # trusted publishing and provenance
    steps:
      # Credentials stay: changesets pushes the version branch and tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          # Publishing stays off until the repository variable is set.
          publish-script: ${{ vars.NPM_PUBLISH_ENABLED == 'true' && 'pnpm release' || '' }}
          # scripts/stage-release.mjs tags each version and writes its release.
          create-github-releases: false
          push-git-tags: false
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_CONFIG_PROVENANCE: true

# Pull request titles follow Conventional Commits. A squash merge makes the
# title the commit on main, so this is also the commit history's format.
# The rules: https://github.com/Nodrail/.github/blob/main/CONTRIBUTING.md
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-title-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Title follows the convention
        env:
          # Through the environment, never pasted into the script: a title is
          # written by whoever opens the pull request.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [a-z0-9`@].*[^.]$'
          # 72 is the aim; Dependabot's group titles need a little more room.
          if [[ ${#TITLE} -gt 100 ]]; then
            echo "::error::The title is ${#TITLE} characters; keep it to 72."
            exit 1
          fi
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::Use type(scope) and a summary, such as 'fix(engine): match secret names case-insensitively'. Types: feat, fix, perf, refactor, docs, test, build, ci, chore, revert. Lowercase summary, no full stop, ! before the colon for a breaking change."
            exit 1
          fi
          echo "Title follows the convention."
